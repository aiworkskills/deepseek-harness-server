name: 功能建议
description: 提议一个新能力或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景，而不是直接描述方案。什么接入工作现在做不了或很难做？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: 权限与安全影响
      description: |
        这个能力是否需要新的 Scope、新的配置层，或者让模型接触到新的数据？
        谁来做最终授权？如果不涉及，写「无」。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
