name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for dir in packages/*/; do
            version=$(node -p "require('./${dir}package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::${dir}package.json is $version but the tag is $tag"
              exit 1
            fi
          done

      - name: Typecheck, test and build
        run: corepack pnpm check

      - name: End-to-end contract check
        run: corepack pnpm example

      - name: Check release artifacts and secrets
        run: corepack pnpm release:check

      - name: Publish to npm
        run: |
          corepack pnpm --filter @dshserver/dsh-integration publish --access public --provenance --no-git-checks
          corepack pnpm --filter @dshserver/runtime-gateway publish --access public --provenance --no-git-checks
          corepack pnpm --filter @dshserver/dsh-preferences publish --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
