# Enterprise overlay applied after the official dsh-base and dsh-web-app bundles.
# It removes dangerous host administration surfaces, pins the Agent Preset, and
# exposes DSH's native configuration plane only in administrator runtimes. All
# runtimes consume the resulting tenant model catalog.
#
# Every entry here is re-applied on each Runtime start and therefore wins over
# anything an administrator saved: that is the point for policy, and wrong for
# defaults. Deployment model defaults live in `model-seed.patch.yml`, which the
# Gateway appends only while the profile has no persisted entries.

- id: session-title-llm
  disabled: true

# Two mutually exclusive model routes, selected by whether the deployment named
# an endpoint. `DSHSERVER_MODEL_BASE_URL` set means "this deployment brings its
# own OpenAI-compatible endpoint"; unset keeps the stock DeepSeek route.
#
# They are exclusive on purpose. Leaving the official provider enabled next to a
# self-hosted one puts three DeepSeek entries in the model picker that nobody
# can use — there is no DeepSeek credential in that deployment.
- id: llm-deepseek
  disabled: !!js Boolean(process.env.DSHSERVER_MODEL_BASE_URL)

# `llm-pi-ai` appears exactly once, and that is load-bearing. It carries both
# "enable the plugin" and the provider declaration; splitting those across two
# entries with the same id makes the patch merge overwrite one with the other,
# and the Runtime dies with `provider has an empty baseURL` — after the
# readiness probe, so the outside only ever sees a 503.
#
# The declaration lives here rather than in `model-seed.patch.yml` because the
# seed is appended only while the profile holds no administrator entries: once
# anyone saves settings the seed stops applying, and a provider route that
# disappeared would leave the default model pointing at nothing.
- id: llm-pi-ai
  # 表达式整体加引号，且不用前置 `!`：紧跟 `!!js ` 的 `!` 会被 YAML 当成第二个
  # 标签（duplication of a tag property），而三元里的 `: ` 会被当成映射分隔符
  # （bad indentation of a mapping entry）。两种都让整份 overlay 解析失败。
  disabled: !!js "process.env.DSHSERVER_MODEL_BASE_URL ? false : true"
  config:
    providers:
      # The key is static — YAML keys cannot be expressions — so a deployment
      # on this route must have `DSHSERVER_MODEL_PROVIDER` equal to it. The
      # seed below defaults to the same name; a host that overrides it with
      # something else routes the default model to a provider that is not here.
      aiworkskills:
        displayName: !!js process.env.DSHSERVER_MODEL_DISPLAY_NAME || process.env.DSHSERVER_MODEL_PROVIDER || 'aiworkskills'
        api: openai-completions
        baseURL: !!js process.env.DSHSERVER_MODEL_BASE_URL
        apiKeyEnv: !!js process.env.DSHSERVER_MODEL_API_KEY_ENV || 'AIWORKSKILLS_API_KEY'
        models:
          - id: !!js process.env.DSHSERVER_MODEL_ID
            name: !!js process.env.DSHSERVER_MODEL_NAME || process.env.DSHSERVER_MODEL_ID
            # Which input shapes the endpoint accepts. Absent, pi-ai treats it
            # as `['text']` — and that is not a guess but the *absence* of a
            # declaration: there is no way to ask a gateway whether it takes
            # images, and the two ways of being wrong cost differently.
            # Understate it and an image is refused before it is attached (the
            # user sees "this model does not support images"); overstate it and
            # the image is accepted, the message persisted, and only then
            # refused upstream — leaving the session stuck on a request that
            # can never succeed.
            #
            # So this is a statement about the endpoint, written by whoever
            # knows what it serves. Change it when the model changes.
            #
            # Static array, not a `!!js` expression: the expression node at this
            # position is not evaluated, and the validator reports
            # `expected array but got [object Object]` — again after the
            # readiness probe, so again only a 503 is visible.
            input: [text, image]

# All runtimes in one OAuth tenant consume the same administrator-owned model
# configuration. DSH providers coordinate writes across processes and hot-reload
# external changes; only the Gateway decides who may call their write APIs.
- id: settings
  config:
    path: !!js process.env.DSHSERVER_SETTINGS_PATH

# Register tenant behavior at Host lifetime so the native settings page works
# before any session mounts the business Agent Preset.
- insert:
    - id: dshserver-integration-settings
      name: '@dshserver/dsh-integration/settings'
      config:
        requestTimeoutMs: 15000
        writeOperationsEnabled: true
        minimumWriteReasonLength: 2

- id: credentials
  config:
    path: !!js process.env.DSHSERVER_CREDENTIALS_PATH

# 文件沙箱档位。写死 read-only 时 `RuntimeManagerOptions.permissionMode` 是个
# 摆设——它注入了 DSH_PERMISSION_MODE，而这里不读它。
#
# `read-only` 仍是默认，也是失败时该落到的那一档。要产出文件的部署（写报告、
# 排版、导出）设 workspace-write：写入被限制在本 Runtime 自己的工作区里，网关的
# 文件和签发私钥仍在边界外。
#
# 连接器不接受 danger-full-access —— `RuntimePermissionMode` 只有两个取值。要那一档
# 的部署得先把隔离换成容器后端，并接受「Runtime 主机是可牺牲的」这个前提。
- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE || 'read-only'
    workspaceRoot: !!js process.env.DSHSERVER_WORKSPACE_ROOT

- id: approval
  config:
    policy: ask

# Host-plane capabilities ordinary business users must never reach.
- id: directory-picker
  disabled: true

# api-gateway injects this service at boot even when the directory picker UI is
# absent. The enterprise Gateway denies its model-facing RPCs below, so it is
# an internal dependency rather than an end-user capability.
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

- id: plugin-inventory
  disabled: true

- id: cordis-host-runner
  disabled: true

- id: cordis-client-runner
  disabled: true

# General settings are available to every user so the built-in appearance
# controls remain reachable. Platform configuration pages remain administrator-only.
- id: ui-settings-general
  disabled: false

- id: ui-settings-models
  disabled: !!js process.env.DSHSERVER_SETTINGS_ENABLED !== '1'

- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-settings-plugins
  disabled: !!js process.env.DSHSERVER_SETTINGS_ENABLED !== '1'

# The browser plugin persists personal appearance for every user and registers
# the connector card lazily. Only administrator profiles declare the plugin
# settings slot above; the Gateway independently enforces platform write scope.
- insert:
    - id: dshserver-preferences
      name: '@dshserver/dsh-preferences'

# Files a session produced, opened in the browser rather than handed to the
# server's desktop. `workspaces.openPath` targets the *host machine*, which in a
# hosted deployment has no desktop and nobody sitting at it — so a user told
# "article.html is ready" could only ever get a refusal. Takes over that one
# exit, which is the one all three surfaces share: badges, file mentions and
# tool rows are fixed together.
- insert:
    - id: dshserver-deliverables
      name: '@dshserver/dsh-deliverables'

# Who may dress this Runtime's chrome when it is embedded in someone's page.
# Empty — the default everywhere this variable is unset — serves the route,
# answers with no origin, and leaves every surface as DSH shipped it. A
# deployment that has not named an origin gets the standalone product, not an
# open door.
- insert:
    - id: dshserver-embed-chrome
      name: '@dshserver/dsh-embed-chrome'
      config:
        hostOrigin: !!js process.env.DSHSERVER_EMBED_HOST_ORIGIN

- id: ui-agent-preset
  disabled: true

- id: ui-permission
  disabled: true

- id: ui-cordis
  disabled: true

# 技能列表放出来。装了 skill 而不让用户看见有哪些，等于要他们靠猜去触发。
- id: ui-skill
  disabled: false

- id: ui-subagent
  disabled: true

- id: ui-plan
  disabled: true

- id: ui-goal
  disabled: true

- id: ui-jobs
  disabled: true

- id: agent-presets
  config:
    default: business
    # The DSH CLI owns the shipped roots and appends its DSH_HOME extension
    # root. This deployment owns the whole per-user DSH_HOME and writes the
    # only preset there; users cannot reach preset management APIs or UI.
    includeUserRoot: true
