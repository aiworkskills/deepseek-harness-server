- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是销售团队的智能助手，可以正常回答一般问题。需要业务数据时，你可以在当前登录管理者的团队范围内查询、统计和更新客户销售阶段。
      身份由 OAuth 委托授权提供，不得要求 userId、tenantId 或访问令牌。执行写操作时要复述目标和结果。
    # 两个都用默认值，且这不是"没想过"而是想过之后回到默认。
    #
    # complete: true 会让这段人设成为**完整**的系统提示，压掉其余所有段落——包括
    # DSH 关于怎么用工具的指引。当初这个 Preset 只有几个窄接口业务工具时说得通；
    # 给了文件工具之后就不成立了：模型手里有工具却没有任何关于怎么用的说明，
    # 表现是它告诉用户"我没有写文件的权限"。
    #
    # includeRuntimeContext: false 会关掉运行时上下文快照，工作区路径也一并不可见。
    # 症状很具体：模型不知道自己在哪，猜了一个 /testbed 写进去，被沙箱拒绝，然后
    # 靠 Glob/Read 一步步摸索工作区根目录。
    complete: false
    includeRuntimeContext: true

- id: dshserver-business
  name: '@dshserver/dsh-integration'
  config:
    brokerUrl: !!js process.env.DSHSERVER_INTERNAL_ORIGIN
    businessApiUrl: !!js process.env.DSHSERVER_INTERNAL_ORIGIN
    runtimeLeaseFile: !!js process.env.DSHSERVER_RUNTIME_LEASE_FILE
    scopes: !!js process.env.DSHSERVER_SCOPES.split(' ')
    exposedTools: !!js JSON.parse(process.env.DSHSERVER_EXPOSED_TOOLS)
    readScope: customers:read:team
    requestTimeoutMs: 15000

# Preset 是 agent 平面的**完整组合**：没列进来的插件，对模型就不存在。只放人设和
# 业务插件时，模型手里就只有那几个业务工具——它会去猜 "Bash"、"function" 这类
# 别家的工具名，全部 unknown tool，然后告诉用户"我没有写文件的权限"。那不是权限
# 问题，是这些工具压根不在它的组合里。
#
# 列进来的只有读写与检索，**没有 shell**。上游业务 Preset 正是靠"不列"把 shell
# 挡在外面，这里保持同一姿态：产出一份文件不需要执行命令，而本部署的 Runtime 是
# 网关的子进程，和 OAuth 签发私钥、业务 API 同在一个容器里。
#
# 写入范围由 sandbox-policy 约束（见 dsh-profile）。工具在、档位是 read-only 时，
# 每次写都会被拒——两者要一起改。
# Shell。此前有意不给：那时 Runtime 是网关的子进程，与 OAuth 签发私钥、业务 API 同在
# 一个容器里。换成容器后端之后这个理由不再成立——每 Runtime 一个容器、cap_drop ALL、
# 私有网络、不发布端口、只挂自己的 home，能碰到的最坏情况是它自己那个一次性容器。
#
# 需要它是因为 .docx / .pptx 是 ZIP 容器，纯文本写入生成不出来，必须执行代码打包。
# 沙箱范围仍由 sandbox-policy 约束在会话工作区内。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    # 必填项。漏掉会让整个 Preset 挂载失败（agent-preset-invalid），表现为会话
    # 根本建不起来——Runtime 本身照常 ready，因为 Preset 插件是建会话时才加载的。
    # 取值与 base bundle 一致，避免两处悄悄分叉。
    sampleOverCapGlobResults: false

- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

# Skill：两个插件缺一不可，而缺了哪个的症状不一样。只放 skill-filesystem，skill 被
# 扫到了但模型没有工具去调；只放 tool-skill，工具在但一个 skill 都发现不了。官方
# standard preset 也是两个一起列。
#
# customSkillDirs 指部署方维护的只读技能目录，所有用户共享。`$DSH_HOME/skills` 那条
# 路径是每用户的，本部署不用——技能属于部署，不属于某个用户。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    # 数组写成静态 YAML 序列，表达式只放在**元素**上。整个数组作为一个 !!js
    # 表达式不会被求值——校验器拿到的是节点本身，报 `expected array but got
    # [object Object]`，而这发生在就绪探测之后，外面只看到 Preset 挂载失败。
    customSkillDirs:
      - !!js process.env.DSHSERVER_SKILL_ROOT

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
