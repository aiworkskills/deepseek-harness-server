packages:
  # 技能脚本不是要发布的包，但它们 import npm 依赖，而技能目录是被原样拷进镜像的。
  # 列进 workspace 后 pnpm 在技能目录里建出相对符号链接、指向根 `.pnpm`——镜像已经
  # 同时拷了 config/ 和 node_modules/，两边都在，脚本就解析得到。
  - config/skills/*
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true

# 下面这份清单由 pnpm 在 install 时维护：DSH 的预发布版本发布不久就要用，
# 会被 minimumReleaseAge 挡住。升级 DSH 时不要手工编辑，清空后跑一次 install，
# 让 pnpm 按新版本重新写——手写漏一个会以 ERR_PNPM_NO_MATCHING_VERSION 报出来，
# 而且报的是版本区间求交后的结果，跟漏掉的那个包对不上号。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent-default-model@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-agent-presets@0.1.5-alpha.1'
  - '@deepseek-ai/dsh-agent@0.1.5-alpha.1'
